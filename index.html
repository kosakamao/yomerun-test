<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Adobe InDesign HTML5 Package が生成する既存ファイルをそのまま利用 -->
  <script src="publication-web-resources/script/main.js"></script>

  <title>立ち読みビューア｜Yomerun v0.9.1</title>

  <style>
    :root {
      --toolbar-h: 64px;
      --bg: #eeeeee;
      --panel: #ffffff;
      --line: #dddddd;
      --text: #444444;

      /* B5見開き：InDesign生成HTMLの固定サイズ */
      --book-w: 1032px;
      --page-w: 516px;
      --book-h: 729px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) var(--toolbar-h);
    }

    /* ===== 誌面エリア ===== */

    #viewerArea {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 0;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    #scrollContent {
      position: relative;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /*
      shell は「縮小後の実表示サイズ」。
      中の stage は1032×729固定で、transformだけで拡大縮小する。
      これによりブラウザ幅・高さのどちらにも確実に収める。
    */
    #stageShell {
      position: relative;
      flex: 0 0 auto;
      overflow: visible;
      /* 影は実際に紙面がある場所だけに適用する */
    }

    #bookStage {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--book-w);
      height: var(--book-h);
      transform-origin: 0 0;
      background: white;
      overflow: hidden;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .18));
    }

    #contentIFrame {
      display: block;
      width: 100%;
      height: var(--book-h);
      border: 0;
      margin: 0;
      padding: 0;
      background: white;
    }

    #dummyIFrame {
      display: none;
    }

    /*
      誌面保存抑止用の透明シールド。
      iframeより上，ノド・ページ送りボタンより下に配置する。
      紙面画像そのものを右クリック対象にしないため，
      file://でのローカル確認時にもブラウザ標準の
      「画像を保存」メニューを出さない。
    */
    #interactionShield {
      position: absolute;
      z-index: 9;
      inset: 0;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
    }

    /* ノド */
    #gutter {
      position: absolute;
      z-index: 10;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 34px;
      transform: translateX(-50%);
      pointer-events: none;
      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0),
          rgba(0, 0, 0, .07) 28%,
          rgba(0, 0, 0, .17) 48%,
          rgba(0, 0, 0, .17) 52%,
          rgba(0, 0, 0, .07) 72%,
          rgba(0, 0, 0, 0)
        );
    }

    /* 誌面左右のページ送り */
    .pageArrow {
      position: absolute;
      z-index: 30;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 64px;
      border: 0;
      border-radius: 4px;
      background: rgba(80, 80, 80, .24);
      color: white;
      font-size: 38px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0 0 4px;
      user-select: none;
      transition: background .15s ease, opacity .15s ease;
    }

    .pageArrow:hover {
      background: rgba(80, 80, 80, .42);
    }

    .pageArrow:disabled {
      opacity: 0;
      pointer-events: none;
    }

    #pagePrev {
      left: 8px;
    }

    #pageNext {
      right: 8px;
    }

    /* ===== ツールバー ===== */

    #toolbar {
      height: var(--toolbar-h);
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      z-index: 100;
    }

    .toolButton {
      min-width: 38px;
      height: 38px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      background: #ffffff;
      color: #444444;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0 10px;
    }

    .toolButton:hover:not(:disabled) {
      background: #f3f3f3;
    }

    .toolButton:disabled {
      opacity: .28;
      cursor: default;
    }

    #pageCounter {
      min-width: 94px;
      height: 38px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    #zoomLabel {
      min-width: 52px;
      text-align: center;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 560px) {
      :root {
        --toolbar-h: 58px;
      }

      #scrollContent {
        padding: 6px;
      }

      #toolbar {
        gap: 3px;
        padding: 6px;
      }

      .toolButton {
        min-width: 34px;
        height: 36px;
        padding: 0 7px;
        font-size: 18px;
      }

      #pageCounter {
        min-width: 74px;
        height: 36px;
        padding: 0 8px;
        font-size: 12px;
      }

      #zoomLabel {
        min-width: 44px;
        font-size: 12px;
      }

      .pageArrow {
        width: 32px;
        height: 54px;
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
<div id="app">

  <main id="viewerArea">
    <div id="scrollContent">
      <div id="stageShell">
      <div id="bookStage">
        <iframe
          id="contentIFrame"
          src="publication-web-resources/html/publication.html"
          title="立ち読み誌面"
        ></iframe>
        <iframe id="dummyIFrame" aria-hidden="true"></iframe>
        <div id="interactionShield" aria-hidden="true"></div>
        <div id="gutter"></div>
      </div>

      <button id="pagePrev" class="pageArrow" type="button" aria-label="前の見開き">‹</button>
      <button id="pageNext" class="pageArrow" type="button" aria-label="次の見開き">›</button>
      </div>
    </div>
  </main>

  <nav id="toolbar" aria-label="立ち読み操作">
    <button id="firstBtn" class="toolButton" type="button" title="先頭">|‹</button>
    <button id="prevBtn" class="toolButton" type="button" title="前へ">‹</button>

    <div id="pageCounter" aria-live="polite">1 / 1</div>

    <button id="nextBtn" class="toolButton" type="button" title="次へ">›</button>
    <button id="lastBtn" class="toolButton" type="button" title="最後">›|</button>

    <span style="width:4px"></span>

    <button id="zoomOutBtn" class="toolButton" type="button" title="縮小">−</button>
    <div id="zoomLabel">100%</div>
    <button id="zoomInBtn" class="toolButton" type="button" title="拡大">＋</button>
  </nav>

</div>

<script>
(() => {
  "use strict";

  /*
   * B5固定版
   * InDesign生成publication*.htmlのbodyサイズ：
   * 1032 × 729 px
   */
  const BOOK_WIDTH = 1032;
  const SINGLE_WIDTH = 516;
  const BOOK_HEIGHT = 729;

  const viewerArea = document.getElementById("viewerArea");
  const scrollContent = document.getElementById("scrollContent");
  const stageShell = document.getElementById("stageShell");
  const bookStage = document.getElementById("bookStage");
  const contentIFrame = document.getElementById("contentIFrame");
  const dummyIFrame = document.getElementById("dummyIFrame");

  const firstBtn = document.getElementById("firstBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const lastBtn = document.getElementById("lastBtn");
  const zoomOutBtn = document.getElementById("zoomOutBtn");
  const zoomInBtn = document.getElementById("zoomInBtn");
  const pagePrev = document.getElementById("pagePrev");
  const pageNext = document.getElementById("pageNext");
  const pageCounter = document.getElementById("pageCounter");
  const zoomLabel = document.getElementById("zoomLabel");
  const interactionShield = document.getElementById("interactionShield");
  const gutter = document.getElementById("gutter");

  /*
   * 透明シールド上のコンテキストメニューとドラッグを無効化。
   * iframe内部のPNGにポインターイベントが届かないため，
   * ブラウザ標準の「画像を保存」を通常操作から抑止できる。
   */
  interactionShield.addEventListener("contextmenu", (event) => {
    event.preventDefault();
  });

  interactionShield.addEventListener("dragstart", (event) => {
    event.preventDefault();
  });

  /*
   * v0.9: タッチスクリーンの左右スワイプでページを切り替える。
   * 透明シールド上でタッチを検出するためiframe内部に依存しない。
   * 2本指以上，縦方向の移動，拡大中はページ送りしない。
   * トラックパッドのwheel操作は対象外。
   */
  let touchStart = null;
  const SWIPE_MIN_PX = 45;
  interactionShield.addEventListener("touchstart", (event) => {
    touchStart = null;
    if (event.touches.length !== 1 || zoomLevel > 1.001) return;
    const t = event.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  interactionShield.addEventListener("touchmove", (event) => {
    if (event.touches.length !== 1) touchStart = null;
  }, { passive: true });

  interactionShield.addEventListener("touchend", (event) => {
    if (!touchStart || event.changedTouches.length !== 1 || zoomLevel > 1.001) {
      touchStart = null;
      return;
    }
    const t = event.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    if (dx < 0) loadPage(pageIndex + 1);
    else loadPage(pageIndex - 1);
  }, { passive: true });

  interactionShield.addEventListener("touchcancel", () => {
    touchStart = null;
  }, { passive: true });

  /*
   * Adobeのmain.jsが生成する totalHtmlFiles を利用。
   * 万一取得できない場合でも1見開きとして動く。
   */
  const pageTotal =
    (typeof totalHtmlFiles !== "undefined" && Number(totalHtmlFiles) > 0)
      ? Number(totalHtmlFiles)
      : 1;

  // PCでは見開き単位，スマホ縦向きでは物理ページ単位で進める。
  // 表1・表4はそれぞれ1ページとして扱う。
  let pageIndex = 0;
  let mobileMode = false;
  const mobileQuery = window.matchMedia("(max-width: 600px) and (orientation: portrait)");

  function isSinglePage(index) {
    return pageTotal >= 2 && (index === 0 || index === pageTotal - 1);
  }
  function mobilePageTotal() {
    return pageTotal <= 1 ? 1 : 2 * (pageTotal - 2) + 2;
  }
  function displayTotal() {
    return mobileMode ? mobilePageTotal() : pageTotal;
  }
  function sourcePage(index) {
    if (!mobileMode || pageTotal <= 1) return { file: index, half: 0 };
    if (index === 0) return { file: 0, half: 0 };
    if (index === mobilePageTotal() - 1) return { file: pageTotal - 1, half: 0 };
    const offset = index - 1;
    return { file: 1 + Math.floor(offset / 2), half: offset % 2 };
  }
  function syncDisplayMode() {
    const next = mobileQuery.matches;
    if (next === mobileMode) return;
    const oldSource = sourcePage(pageIndex);
    mobileMode = next;
    if (mobileMode) {
      pageIndex = oldSource.file === 0 ? 0
        : oldSource.file === pageTotal - 1 ? mobilePageTotal() - 1
        : 1 + (oldSource.file - 1) * 2;
    } else {
      pageIndex = oldSource.file;
    }
    pageIndex = Math.max(0, Math.min(displayTotal() - 1, pageIndex));
    contentIFrame.src = publicationUrl(sourcePage(pageIndex).file);
  }

  /*
   * zoomLevel=1 が「画面にフィットした状態＝100%」
   * ユーザー操作ではフィット倍率を基準に拡大縮小する。
   */
  let zoomLevel = 1;
  const ZOOM_MIN = 0.50;
  const ZOOM_MAX = 2.50;
  const ZOOM_STEP = 0.25;

  function publicationUrl(index) {
    if (index === 0) {
      return "publication-web-resources/html/publication.html";
    }
    return `publication-web-resources/html/publication-${index}.html`;
  }

  function loadPage(index) {
    pageIndex = Math.max(0, Math.min(displayTotal() - 1, index));
    const source = sourcePage(pageIndex);
    const sourceWidth = isSinglePage(source.file) ? SINGLE_WIDTH : BOOK_WIDTH;
    bookStage.style.width = `${sourceWidth}px`;
    contentIFrame.src = publicationUrl(source.file);
    gutter.style.display = mobileMode || isSinglePage(source.file) ? "none" : "";
    applyScale();
    viewerArea.scrollTo({ left: 0, top: 0 });

    const nextSource = sourcePage(Math.min(pageIndex + 1, displayTotal() - 1));
    if (nextSource.file !== source.file) dummyIFrame.src = publicationUrl(nextSource.file);
    updateControls();
  }

  function updateControls() {
    const atFirst = pageIndex === 0;
    const atLast = pageIndex === displayTotal() - 1;
    firstBtn.disabled = prevBtn.disabled = pagePrev.disabled = atFirst;
    nextBtn.disabled = lastBtn.disabled = pageNext.disabled = atLast;
    pageCounter.textContent = `${pageIndex + 1} / ${displayTotal()}`;
    zoomOutBtn.disabled = zoomLevel <= ZOOM_MIN + 0.001;
    zoomInBtn.disabled = zoomLevel >= ZOOM_MAX - 0.001;
    zoomLabel.textContent = `${Math.round(zoomLevel * 100)}%`;
  }

  /*
   * 重要：
   * stageShell自身を「縮小後の実寸」にする。
   * transformされたbookStageだけを中央配置しようとすると、
   * CSSレイアウト上は1032×729のままなので前版のような
   * 切れ・巨大表示が起きる。
   */
  function applyScale() {
    const areaWidth = viewerArea.clientWidth;
    const areaHeight = viewerArea.clientHeight;

    const contentStyle = getComputedStyle(scrollContent);
    const horizontalPadding =
      parseFloat(contentStyle.paddingLeft) + parseFloat(contentStyle.paddingRight);
    const verticalPadding =
      parseFloat(contentStyle.paddingTop) + parseFloat(contentStyle.paddingBottom);

    const availableWidth = Math.max(1, areaWidth - horizontalPadding);
    const availableHeight = Math.max(1, areaHeight - verticalPadding);

    const fitWidth = mobileMode ? SINGLE_WIDTH : BOOK_WIDTH;
    const fitScale = Math.min(
      availableWidth / fitWidth,
      availableHeight / BOOK_HEIGHT
    );

    const actualScale = fitScale * zoomLevel;

    const shownWidth = fitWidth * actualScale;
    const shownHeight = BOOK_HEIGHT * actualScale;

    stageShell.style.width = `${shownWidth}px`;
    stageShell.style.height = `${shownHeight}px`;

    const source = sourcePage(pageIndex);
    // モバイルでは見開きの右半分を左へ寄せて切り出す。
    // デスクトップ表1は右側に置く（v0.7.2の動作を維持）。
    const offsetX = mobileMode ? -source.half * SINGLE_WIDTH
      : (source.file === 0 && isSinglePage(source.file) ? SINGLE_WIDTH : 0);
    stageShell.style.overflow = mobileMode ? "hidden" : "visible";
    bookStage.style.left = "0px";
    bookStage.style.transform = `scale(${actualScale}) translateX(${offsetX}px)`;

    scrollContent.style.width =
      `${Math.max(areaWidth, shownWidth + horizontalPadding)}px`;
    scrollContent.style.height =
      `${Math.max(areaHeight, shownHeight + verticalPadding)}px`;

    updateControls();
  }

  function setZoom(value) {
    zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, value));
    interactionShield.style.touchAction = zoomLevel > 1.001 ? "auto" : "pan-y";
    applyScale();
  }

  firstBtn.addEventListener("click", () => loadPage(0));
  prevBtn.addEventListener("click", () => loadPage(pageIndex - 1));
  nextBtn.addEventListener("click", () => loadPage(pageIndex + 1));
  lastBtn.addEventListener("click", () => loadPage(displayTotal() - 1));

  pagePrev.addEventListener("click", () => loadPage(pageIndex - 1));
  pageNext.addEventListener("click", () => loadPage(pageIndex + 1));

  zoomOutBtn.addEventListener("click", () => setZoom(zoomLevel - ZOOM_STEP));
  zoomInBtn.addEventListener("click", () => setZoom(zoomLevel + ZOOM_STEP));

  function disableSaveGestures(doc) {
    if (!doc) return;

    doc.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    }, { capture: true });

    doc.addEventListener("dragstart", (event) => {
      event.preventDefault();
    }, { capture: true });
  }

  disableSaveGestures(document);

  contentIFrame.addEventListener("load", () => {
    try {
      disableSaveGestures(contentIFrame.contentDocument);
    } catch (error) {
      console.warn("iframe内の右クリック抑止を設定できませんでした。", error);
    }
  });

  window.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft") {
      loadPage(pageIndex - 1);
    } else if (event.key === "ArrowRight") {
      loadPage(pageIndex + 1);
    } else if (event.key === "Home") {
      loadPage(0);
    } else if (event.key === "End") {
      loadPage(displayTotal() - 1);
    } else if (event.key === "+" || event.key === "=") {
      setZoom(zoomLevel + ZOOM_STEP);
    } else if (event.key === "-" || event.key === "_") {
      setZoom(zoomLevel - ZOOM_STEP);
    }
  });

  /*
   * ResizeObserverでviewerAreaの実サイズ変化を追う。
   * WordPressのiframe内で高さ・幅が変わった場合にも対応。
   */
  function handleResize() {
    const wasMobile = mobileMode;
    syncDisplayMode();
    if (wasMobile !== mobileMode) loadPage(pageIndex);
    else applyScale();
  }
  const resizeObserver = new ResizeObserver(handleResize);
  resizeObserver.observe(viewerArea);

  window.addEventListener("resize", handleResize);

  syncDisplayMode();
  loadPage(0);

  /*
   * CSSレイアウト確定後にも再計算。
   * file://で直接開いた場合の初期レンダリング差も吸収する。
   */
  requestAnimationFrame(() => {
    applyScale();
    requestAnimationFrame(applyScale);
  });
})();
</script>
</body>
</html>
